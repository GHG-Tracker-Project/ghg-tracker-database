stages:
  gwp:
    cmd: importer gwp > logs/gwp.log
    outs:
      - logs/gwp.log

  earth:
    cmd: importer earth > logs/earth.log
    outs:
      - logs/earth.log

  iso-3166-1:
    cmd: importer iso-3166-1 > logs/iso-3166-1.log
    deps:
      - logs/earth.log
    outs:
      - logs/iso-3166-1.log

  iso-3166-2:
    cmd: importer iso-3166-2 > logs/iso-3166-2.log
    deps:
      - logs/iso-3166-1.log
    outs:
      - logs/iso-3166-2.log

  locode:
    cmd: importer locode > logs/locode.log
    deps:
      - logs/iso-3166-1.log
      - logs/iso-3166-2.log
    outs:
      - logs/locode.log

  wpp:
    cmd: importer wpp > logs/wpp.log
    deps:
      - logs/iso-3166-1.log
    outs:
      - logs/wpp.log

  world-bank-gdp:
    cmd: importer world-bank > logs/world-bank.log
    deps:
      - logs/iso-3166-1.log
    outs:
      - logs/world-bank.log

  us-state-population:
    cmd: importer sequential fred-state-population > logs/fred-state-population.log
    deps:
      - logs/iso-3166-2.log
    outs:
      - logs/fred-state-population.log

  canada-province-population:
    cmd: importer sequential canada-province-population > logs/canada-province-population.log
    deps:
      - logs/iso-3166-2.log
    outs:
      - logs/canada-province-population.log

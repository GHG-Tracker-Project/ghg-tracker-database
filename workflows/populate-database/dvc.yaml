stages:
  earth:
    cmd: importer earth > logs/earth.log
    outs:
      - logs/earth.log

  iso-3166-1:
    cmd: importer iso-3166-1 > logs/iso-3166-1.log
    deps:
      - logs/earth.log
    outs:
      - logs/iso-3166-1.log

  iso-3166-2:
    cmd: importer iso-3166-2 > logs/iso-3166-2.log
    deps:
      - logs/iso-3166-1.log
    outs:
      - logs/iso-3166-2.log

  locode:
    cmd: importer locode > logs/locode.log
    deps:
      - logs/iso-3166-1.log
      - logs/iso-3166-2.log
    outs:
      - logs/locode.log
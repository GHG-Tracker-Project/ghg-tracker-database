[project]
name = "ghg-database"
version = "0.1.0"
description = "ghg tracker database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.1",
    "bottleneck>=1.5.0",
    "dask>=2025.5.1",
    "dvc[gdrive]>=3.59.2",
    "netcdf4>=1.7.2",
    "pandas>=2.2.3",
    "psycopg>=3.2.9",
    "sqlmodel>=0.0.24",
    "xarray>=2025.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

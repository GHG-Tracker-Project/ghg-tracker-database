[project]
name = "ghg-database"
version = "0.1.0"
description = "ghg tracker database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.1",
    "boto3>=1.37.3",
    "botocore>=1.37.3",
    "bottleneck>=1.5.0",
    "dask>=2025.5.1",
    "dvc[s3]>=3.59.2",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "netcdf4>=1.7.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "polars>=1.31.0",
    "psycopg>=3.2.9",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.12",
    "sqlmodel>=0.0.24",
    "typer>=0.16.0",
    "uvicorn>=0.34.3",
    "xarray>=2025.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models", "utils", "cli"]

[tool.ruff]
lint.extend-select = ["PTH"]

[project.scripts]
importer = "cli.main:app"
